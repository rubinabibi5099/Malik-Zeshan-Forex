name: Telegram Bot Workflow
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install python-telegram-bot
      - name: Run Bot
        run: python bot.py
